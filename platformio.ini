; PlatformIO Project Configuration File for FluidTouch
; Elecrow CrowPanel 7" ESP32 HMI Display (Basic and Advance versions)
; Product URLs:
;   Basic: https://www.awin1.com/cread.php?awinmid=82721&awinaffid=2663106&ued=https%3A%2F%2Fwww.elecrow.com%2Fesp32-display-7-inch-hmi-display-rgb-tft-lcd-touch-screen-support-lvgl.html
;   Advance: https://www.awin1.com/cread.php?awinmid=82721&awinaffid=2663106&ued=https%3A%2F%2Fwww.elecrow.com%2Fcrowpanel-advance-7-0-hmi-esp32-ai-display-800x480-artificial-intelligent-ips-touch-screen-support-meshtastic-and-arduino-lvgl-micropython.html
; M5Stack Tab5: https://docs.m5stack.com/zh_CN/core/Tab5

; ============================================================================
; Common settings for all ESP32-S3 based hardware versions
; ============================================================================
[s3_common]
platform = https://github.com/Jason2866/platform-espressif32.git#Arduino/IDF53_gcc15
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.maximum_ram_size = 8519680
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; Common build flags
build_flags = 
    -DBOARD_HAS_PSRAM
    -I include
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DVERSION=\"1.0.5\"
    -DCONFIG_SPIRAM_SPEED_120M=1
    -DCONFIG_SPIRAM_FETCH_INSTRUCTIONS=1
    -DCONFIG_SPIRAM_RODATA=1
    -DCONFIG_ESP32S3_DATA_CACHE_LINE_32B=1
    -Os
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

; Bake hardware_defaults.ini factory defaults into the firmware
; (generates include/generated/hardware_defaults.h at build time)
extra_scripts = pre:scripts/generate_defaults.py

; Common library dependencies
lib_deps = 
    lvgl/lvgl@9.5.0
    lovyan03/LovyanGFX@1.2.19
    gilmaimon/ArduinoWebsockets@0.5.4
    bblanchon/ArduinoJson@7.4.3

; ============================================================================
; Elecrow CrowPanel 7" Basic
; Hardware: ESP32-S3-WROOM-1-N4R8 (4MB Flash + 8MB Octal PSRAM)
; Display: 800x480 TN LCD with GT911 capacitive touch
; Backlight: PWM on GPIO2
; ============================================================================
[env:elecrow-crowpanel-7-basic]
extends = s3_common
board_upload.flash_size = 4MB
board_build.partitions = single_app_4MB.csv
build_flags = 
    ${s3_common.build_flags}
    -DHARDWARE_BASIC
    -DBACKLIGHT_PWM

; ============================================================================
; Elecrow CrowPanel 7" Advance v1.2
; Hardware: ESP32-S3-WROOM-1-N16R8 (16MB Flash + 8MB Octal PSRAM)
; Display: 800x480 IPS LCD with GT911 capacitive touch
; Backlight: I2C controller (STC8H1K28 at 0x30) - v1.2 protocol (0x05-0x10)
; ============================================================================
[env:elecrow-crowpanel-7-advance-v12]
extends = s3_common
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags = 
    -Werror=all
build_flags = 
    ${s3_common.build_flags}
    -DHARDWARE_ADVANCE
    -DHARDWARE_ADVANCE_V12
    -DBACKLIGHT_I2C
    -DBACKLIGHT_I2C_ADDR=0x30
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0

; ============================================================================
; Elecrow CrowPanel 7" Advance v1.3
; Hardware: ESP32-S3-WROOM-1-N16R8 (16MB Flash + 8MB Octal PSRAM)
; Display: 800x480 IPS LCD with GT911 capacitive touch
; Backlight: I2C controller (STC8H1K28 at 0x30) - v1.3 protocol (0x00-0xF5, inverted)
; ============================================================================
[env:elecrow-crowpanel-7-advance-v13]
extends = s3_common
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags = 
    -Werror=all
build_flags = 
    ${s3_common.build_flags}
    -DHARDWARE_ADVANCE
    -DBACKLIGHT_I2C
    -DBACKLIGHT_I2C_ADDR=0x30
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0

; ============================================================================
; M5Stack Tab5
; Hardware: ESP32-P4 (16MB Flash + 32MB Octal PSRAM) + ESP32-C6 WiFi module
; Display: 5" 1280x720 IPS MIPI-DSI (ILI9881C+GT911 early units / ST7123 later)
; Graphics: M5GFX (replaces LovyanGFX - has ESP32-P4 MIPI-DSI support)
; WiFi: ESP32-C6 via ESP-Hosted (esp_wifi_remote), standard Arduino WiFi API
; Note: user unit purchased 2025-09 = ILI9881C + GT911 variant (both supported
;       by latest M5GFX auto-detection)
; ============================================================================
[env:m5tab5]
; pioarduino release zip (git source hits a missing postinstall script in PIO)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-p4-evboard
board_build.mcu = esp32p4
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.maximum_ram_size = 7667712
board_build.f_cpu = 360000000L
board_build.f_flash = 80000000L
build_flags = 
    -DBOARD_HAS_PSRAM
    -I include
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DVERSION=\"1.0.5\"
    -DHARDWARE_TAB5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -O2
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    ; PPA 2D accelerator prerequisites (checked by LVGL's ppa driver via
    ; sdkconfig symbols - Arduino prebuilt sdkconfig lacks them)
    -DCONFIG_LV_DRAW_BUF_ALIGN=64
    -DCONFIG_CACHE_L2_CACHE_LINE_SIZE=64
    -DCONFIG_SOC_PPA_SUPPORTED=1
extra_scripts = 
    pre:scripts/fix_riscv_asm_flags.py
    pre:scripts/generate_defaults.py
lib_deps = 
    lvgl/lvgl@9.5.0
    https://github.com/M5Stack/M5GFX.git
    https://github.com/M5Stack/M5Unified.git
    gilmaimon/ArduinoWebsockets@0.5.4
    bblanchon/ArduinoJson@7.4.3
