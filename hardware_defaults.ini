; FluidTouch build-time factory defaults
; ======================================
; Values here are read at compile time (scripts/generate_defaults.py) and baked
; into the firmware, then applied automatically on first boot - only when no
; machine has been configured yet. See docs/configuration.md for details.
;
; Rules:
;   - A default machine is created only when BOTH ssid and url are non-empty.
;   - Values are trimmed of leading/trailing whitespace.
;   - Inline comments start with '#' or ';' (preceded by whitespace).
;   - Length limits: name <= 31, ssid <= 32, password <= 63, url <= 127 chars.
;   - Leave ssid/url empty (or delete this file) to disable the feature.

[machine]
; Display name for the default machine (optional - "My CNC" when left empty)
name = 4x-i2s-junchao

; WiFi network credentials (SSID is case sensitive)
ssid = Rhome-wk
password = timeyin7788..

; FluidNC address: IP ("192.168.1.100") or mDNS hostname ("fluidnc.local")
url = fluidnc.local

; WebSocket port (FluidNC v3.x + WebUI v2: 81, FluidNC v4+: 80)
port = 80
